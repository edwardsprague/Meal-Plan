<style>
  /* No external fonts — this app must work with zero network connectivity.
     System font stacks are chosen to read close to the original design
     (condensed/bold headers, monospace labels) without ever fetching anything. */
  :root{
    --bg:#101214; --card:#16181a; --card2:#1c1f22; --panel2:#131517;
    --border:#2a2d30; --border-hover:#3a3e42;
    --text:#eef0f2; --text2:#9aa0a6; --text3:#8b9096; --text4:#6b7178;
    --lime:#c6ff4a; --blue:#9fe0ff; --pink:#f2a8c8; --orange:#ffb020; --red:#ff5c5c;
    --mono:ui-monospace,'SF Mono','Menlo','Consolas','Roboto Mono',monospace;
    --cond:-apple-system,'SF Pro Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
    --body:-apple-system,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  }
  html,body{ margin:0; padding:0; background:var(--bg); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--body); color:var(--text); }
  ::selection{ background:var(--lime); color:var(--bg); }
  input::placeholder{ color:var(--text4); }
  input{ font-family:inherit; }
  input:focus{ outline:none; border-color:var(--lime) !important; box-shadow:0 0 0 3px rgba(198,255,74,0.14); }
  button{ font-family:inherit; -webkit-user-select:none; user-select:none; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:#16181a; }
  ::-webkit-scrollbar-thumb{ background:#2f3336; border-radius:6px; }
  @keyframes trayUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  a{ color:inherit; }

  /* Smoothness: every tappable thing gets a quick, consistent response instead
     of the default (and on iOS, ugly) tap-flash, plus a subtle press-down. */
  button, .card, .chip-btn, .tab-btn, .qty-btn, .sample-btn, .calc-food-row{
    transition:border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease, transform 0.1s ease, opacity 0.15s ease, box-shadow 0.18s ease;
  }
  button:active, .qty-btn:active{ transform:scale(0.95); }
  .card:active{ transform:scale(0.995); }
  .recipe-fade{ animation:fadeSlideIn 0.18s ease; }

  .hover-border:hover{ border-color:var(--border-hover) !important; }
  .hover-lime:hover{ border-color:var(--lime) !important; }
  .hover-blue:hover{ border-color:var(--blue) !important; }
  .hover-orange:hover{ border-color:var(--orange) !important; }
  .hover-pink:hover{ border-color:var(--pink) !important; }
  .hover-lime-text:hover{ border-color:var(--lime) !important; color:#fff !important; }
  .hover-red:hover{ border-color:var(--red) !important; color:var(--red) !important; }
  .hover-lime-fill{ box-shadow:0 2px 8px rgba(198,255,74,0.16); }
  .hover-lime-fill:hover{ background:#d4ff6e !important; box-shadow:0 4px 14px rgba(198,255,74,0.3); transform:translateY(-1px); }
  .hover-step:hover{ border-color:var(--lime) !important; }
  .card-action-btn:hover{ color:#fff !important; background:var(--card2) !important; }

  .tab-btn{ cursor:pointer; position:relative; background:none; border:none; padding:8px 4px; margin-right:14px; font-family:var(--cond); font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; }
  .chip-btn{ cursor:pointer; align-self:center; border-radius:20px; padding:6px 13px; margin-right:8px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(0,0,0,0.24), 0 10px 24px -16px rgba(0,0,0,0.6); }
  .macro-chip{ flex:1; background:var(--card2); border-radius:8px; padding:8px 10px; text-align:center; }
  .tag-chip{ font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text2); border:1px solid var(--border); padding:3px 8px; border-radius:20px; }
  .qty-btn{ cursor:pointer; width:30px; height:30px; border-radius:8px; background:var(--card2); border:1px solid var(--border); color:var(--text); font-size:18px; line-height:1; }
  .calc-food-row{ background:var(--card2); border:1px solid var(--border); border-radius:10px; }

  [style*="border-radius:16px; overflow:hidden;"]{ box-shadow:0 1px 2px rgba(0,0,0,0.24), 0 12px 28px -18px rgba(0,0,0,0.65); }
  #scoreboardContainer{ box-shadow:0 -14px 28px -10px rgba(0,0,0,0.55); }

  .sb-mobile{ display:none; }

  @media (hover:hover){
    .card:hover{ border-color:var(--border-hover); box-shadow:0 2px 6px rgba(0,0,0,0.3), 0 18px 36px -18px rgba(0,0,0,0.7); transform:translateY(-2px); }
    .tab-btn:hover{ color:#fff !important; }
    .chip-btn:hover{ filter:brightness(1.18); }
    .calc-food-row:hover{ border-color:var(--border-hover); background:#202427; }
  }

  @media (max-width: 640px){
    header{ padding:26px 18px 10px !important; }
    header h1{ font-size:clamp(30px, 11vw, 46px) !important; }
    header > div:nth-of-type(1){ font-size:10px !important; margin-bottom:10px !important; }
    header p{ font-size:14.5px !important; margin-top:12px !important; }
    section, main, #controlsBar{ padding-left:18px !important; padding-right:18px !important; }
    main{ padding-top:6px !important; padding-bottom:24px !important; }
    main #gridWrapper > div[style*="grid-template-columns"]{ grid-template-columns:1fr !important; gap:12px !important; }
    #searchInput{ width:100% !important; flex:1 1 100%; }
    #tabsCollectionsRow{ gap:4px !important; }
    .tab-btn{ font-size:18px !important; margin-right:10px !important; }
    .chip-btn{ font-size:10px !important; padding:5px 10px !important; }

    /* Cards: trim the oversized display type down to something that reads
       calm on a phone instead of shouting. */
    .card h3{ font-size:19px !important; }
    .pp-card-protein{ font-size:30px !important; }
    .pp-card-macro-num{ font-size:16px !important; }
    .card > div:first-child{ padding:16px 16px 14px !important; }

    /* Footer: swap the roomy desktop scoreboard for the compact single-column one. */
    .sb-desktop{ display:none !important; }
    .sb-mobile{ display:block !important; }
  }

  @page{ size:letter; margin:0.5in; }
  @media print{
    [data-noprint]{ display:none !important; }
    html, body{ background:#fff !important; }
    [data-binder]{ display:block !important; }
    [data-binder], [data-binder] *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
</style>
</head>

// Generic ingredients get calories derived from macros (P*4 + C*4 + F*9) — the
// standard approach, since there's no single "real" label behind a generic
// entry to match. Branded/packaged foods set `calories` explicitly above
// instead, matching their actual printed nutrition label exactly (which
// accounts for fiber the way the flat formula doesn't).
CALC_FOODS.forEach(function (f) { if (f.calories == null) f.calories = Math.round(f.protein * 4 + f.carbs * 4 + f.fat * 9); });

// ---------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------

function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function $(id) { return document.getElementById(id); }

// ---------------------------------------------------------------------
// Derived business logic (mirrors the design's renderVals())
// ---------------------------------------------------------------------

function sectionLabel(id) {
  if (id === "breakfast") return "Breakfast";
  if (id === "lunchdinner") return "Lunch / Dinner";
  if (id === "snacks") return "Snacks";
  if (id === "sweets") return "Sweets & Desserts";
  return id;
}

function isBulk(m) { return BULK_IDS.has(m.id); }
function isPrep(m) { return m.tags.indexOf("Meal prep") !== -1; }

function driveFoodsOf(m) {
  var hay = (m.name + " " + m.ingredients.join(" ")).toLowerCase();
  return DRIVE_FOODS.filter(function (f) { return f.re.test(hay); }).map(function (f) { return f.label; });
}
function isDrive(m) { return driveFoodsOf(m).length > 0; }

function dayFit(m) {
  var ref = SLOT_RATIOS[m.section] || SLOT_RATIOS.snacks;
  var mid = (ref.lift + ref.run) / 2;
  var band = mid * 0.14;
  var ratio = m.carbs / Math.max(m.fat, 1);
  if (ratio > mid + band) return "run";
  if (ratio < mid - band) return "lift";
  return "both";
}
function isLift(m) { var f = dayFit(m); return f === "lift" || f === "both"; }
function isRun(m) { var f = dayFit(m); return f === "run" || f === "both"; }
function dayBadgeOf(m) {
  var f = dayFit(m);
  if (f === "lift") return { text: "Lift Day fit", bg: "rgba(198,255,74,0.12)", color: "#c6ff4a" };
  if (f === "run") return { text: "Run Day fit", bg: "rgba(159,224,255,0.12)", color: "#9fe0ff" };
  return { text: "Fits either day", bg: "rgba(255,255,255,0.06)", color: "#9aa0a6" };
}

var COLLECTION_TESTS = { bulk: isBulk, prep: isPrep, drive: isDrive, lift: isLift, run: isRun };

function counts() {
  return {
    bulk: MEALS.filter(isBulk).length,
    prep: MEALS.filter(isPrep).length,
    drive: MEALS.filter(isDrive).length,
    lift: MEALS.filter(isLift).length,
    run: MEALS.filter(isRun).length
  };
}

function filteredMeals() {
  var q = state.search.trim().toLowerCase();
  return MEALS.filter(function (m) {
    if (state.activeSection !== "all" && m.section !== state.activeSection) return false;
    for (var i = 0; i < state.activeCollections.length; i++) {
      var test = COLLECTION_TESTS[state.activeCollections[i]];
      if (test && !test(m)) return false;
    }
    if (!q) return true;
    var hay = (m.name + " " + m.tags.join(" ") + " " + m.ingredients.join(" ")).toLowerCase();
    return hay.indexOf(q) !== -1;
  });
}

// ---- unified day log: recipe cards and calculator foods both write here ----

function dayLogItemMacros(item) {
  if (item.kind === "recipe") {
    var m = MEALS.find(function (x) { return x.id === item.refId; });
    if (!m) return { protein: 0, fat: 0, carbs: 0, calories: 0, satFat: 0 };
    // Recipes don't carry a saturated-fat breakdown (would require re-deriving
    // fat sources per dish), so they contribute 0 to the satFat total — only
    // calculator foods (where every entry has real satFat data) count toward it.
    return { protein: m.protein * item.qty, fat: m.fat * item.qty, carbs: m.carbs * item.qty, calories: m.calories * item.qty, satFat: 0 };
  }
  var food = calcFoodById(item.refId);
  if (!food) return { protein: 0, fat: 0, carbs: 0, calories: 0, satFat: 0 };
  var factor = food.unit === "g" ? (item.qty / 100) : item.qty;
  return {
    protein: food.protein * factor, fat: food.fat * factor, carbs: food.carbs * factor,
    calories: food.calories * factor, satFat: (food.satFat || 0) * factor
  };
}

function dayLogItemLabel(item) {
  if (item.kind === "recipe") {
    var m = MEALS.find(function (x) { return x.id === item.refId; });
    return m ? m.name : item.refId;
  }
  var food = calcFoodById(item.refId);
  return food ? food.name : item.refId;
}

function dayTotals() {
  var t = { protein: 0, fat: 0, carbs: 0, calories: 0, satFat: 0 };
  state.dayLog.forEach(function (it) {
    var m = dayLogItemMacros(it);
    t.protein += m.protein; t.fat += m.fat; t.carbs += m.carbs; t.calories += m.calories; t.satFat += m.satFat;
  });
  return { protein: Math.round(t.protein), fat: Math.round(t.fat), carbs: Math.round(t.carbs), calories: Math.round(t.calories), satFat: Math.round(t.satFat) };
}

function proteinZone(protein) {
  var target = CALC_DAY_TARGETS[state.dayType];
  if (protein === 0) return { label: "Empty", color: "var(--text4)", hint: "Add meals or foods to start building your day." };
  if (protein < CALC_PROTEIN_FLOOR) return { label: "Under floor", color: "var(--red)", hint: (CALC_PROTEIN_FLOOR - protein) + "g under the " + CALC_PROTEIN_FLOOR + "g hard floor." };
  if (protein < target.protein) return { label: "Under target", color: "#8fb03e", hint: (target.protein - protein) + "g under your " + target.label + " target." };
  if (protein <= target.protein + 30) return { label: "On target", color: "var(--lime)", hint: "Clears the floor and on target for " + target.label + "." };
  return { label: "Loaded", color: "var(--blue)", hint: "Well past target — plenty of protein banked." };
}

function sheetsPayload() {
  var st = dayTotals();
  var names = state.dayLog.map(function (it) {
    var label = dayLogItemLabel(it);
    var qtyLabel = it.kind === "recipe" && it.qty > 1 ? (it.qty + "× ") : "";
    return qtyLabel + label;
  });
  var date = new Date().toLocaleDateString("en-US");
  return { date: date, protein: st.protein, calories: st.calories, carbs: st.carbs, fat: st.fat, names: names };
}

// ---------------------------------------------------------------------
// Custom Meal Calculator — logic
// ---------------------------------------------------------------------

function calcFoodById(id) { return CALC_FOODS.find(function (f) { return f.id === id; }); }

function calcMacroZone(current, target, tolerance) {
  var remaining = target - current;
  if (remaining < 0) return { color: "var(--red)", label: "over" };
  if (remaining <= tolerance) return { color: "var(--lime)", label: "near" };
  return { color: "var(--text3)", label: "under" };
}

function calcBar(label, unit, current, target, tolerance) {
  var zone = calcMacroZone(current, target, tolerance);
  var pct = Math.min((current / target) * 100, 100).toFixed(1) + "%";
  var remaining = target - current;
  var remainingText = remaining >= 0
    ? (remaining + unit + " " + label.toLowerCase() + " remaining")
    : (Math.abs(remaining) + unit + " over target");
  return '<div>' +
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;">' +
      '<span style="font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text3);">' + esc(label) + '</span>' +
      '<span style="font-family:var(--cond); font-size:15px; font-weight:600; color:' + zone.color + ';">' + current + unit + '<span style="color:var(--text4); font-weight:400;"> / ' + target + unit + '</span></span>' +
    '</div>' +
    '<div style="position:relative; height:8px; background:var(--card2); border-radius:20px; overflow:hidden;">' +
      '<div style="height:100%; width:' + pct + '; background:' + zone.color + '; border-radius:20px; transition:width 0.3s ease;"></div>' +
    '</div>' +
    '<div style="font-family:var(--mono); font-size:10.5px; color:' + (remaining < 0 ? "var(--red)" : "var(--text3)") + '; margin-top:4px;">' + remainingText + '</div>' +
  '</div>';
}

function calcGenUid() { return "ci" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function toggleCalculator() {
  state.showCalculator = !state.showCalculator;
  renderHeader();
  if (state.showCalculator) renderCalculatorShell();
  else $("calculatorContainer").innerHTML = "";
}

function toggleMacros() {
  state.showMacros = !state.showMacros;
  renderHeader();
  renderMacrosPanel();
}

// Full-width interactive bar for Protein / Carbs / Calories — turns red past target.
function macroFullBar(label, unit, current, target, tolerance) {
  var zone = calcMacroZone(current, target, tolerance);
  var pct = Math.min((current / target) * 100, 100).toFixed(1) + "%";
  var remaining = target - current;
  var remainingText = remaining >= 0
    ? (remaining + unit + " " + label.toLowerCase() + " remaining")
    : (Math.abs(remaining) + unit + " over your " + label.toLowerCase() + " target");
  return '<div style="margin-bottom:22px;">' +
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;">' +
      '<span style="font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3);">' + esc(label) + '</span>' +
      '<span style="font-family:var(--cond); font-size:19px; font-weight:700; color:' + zone.color + ';">' + current + unit + '<span style="color:var(--text4); font-weight:400; font-size:14px;"> / ' + target + unit + '</span></span>' +
    '</div>' +
    '<div style="position:relative; height:10px; background:var(--card2); border-radius:20px; overflow:hidden;">' +
      '<div style="height:100%; width:' + pct + '; background:' + zone.color + '; border-radius:20px; transition:width 0.3s ease;"></div>' +
    '</div>' +
    '<div style="font-family:var(--mono); font-size:11px; color:' + (remaining < 0 ? "var(--red)" : "var(--text3)") + '; margin-top:6px;">' + remainingText + '</div>' +
  '</div>';
}

// Fat gets its own bar, split into unsaturated (the ones you want more of) and
// saturated (the ones to watch) — the split shows composition regardless of
// total, while the number itself turns red once total fat clears the target.
function macroFatBar(current, satCurrent, target) {
  var unsatCurrent = Math.max(current - satCurrent, 0);
  var overTarget = current > target;
  var totalPct = Math.min((current / target) * 100, 100);
  var unsatPct = current > 0 ? (unsatCurrent / current) * totalPct : 0;
  var satPct = current > 0 ? (satCurrent / current) * totalPct : 0;
  var remaining = target - current;
  var remainingText = remaining >= 0 ? (remaining + "g fat remaining") : (Math.abs(remaining) + "g over your fat target");
  return '<div style="margin-bottom:22px;">' +
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;">' +
      '<span style="font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3);">Fat</span>' +
      '<span style="font-family:var(--cond); font-size:19px; font-weight:700; color:' + (overTarget ? "var(--red)" : "var(--text)") + ';">' + current + 'g<span style="color:var(--text4); font-weight:400; font-size:14px;"> / ' + target + 'g</span></span>' +
    '</div>' +
    '<div style="position:relative; height:10px; background:var(--card2); border-radius:20px; overflow:hidden; display:flex;">' +
      '<div style="height:100%; width:' + unsatPct.toFixed(1) + '%; background:var(--lime); transition:width 0.3s ease;"></div>' +
      '<div style="height:100%; width:' + satPct.toFixed(1) + '%; background:var(--orange); transition:width 0.3s ease;"></div>' +
    '</div>' +
    '<div style="display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:11px; flex-wrap:wrap; gap:6px;">' +
      '<span style="color:var(--text3);"><span style="color:var(--lime);">■</span> ' + unsatCurrent + 'g unsaturated <span style="color:var(--orange); margin-left:10px;">■</span> ' + satCurrent + 'g saturated</span>' +
      '<span style="color:' + (remaining < 0 ? "var(--red)" : "var(--text3)") + ';">' + remainingText + '</span>' +
    '</div>' +
  '</div>';
}

function renderMacrosPanel() {
  var el = $("macrosContainer");
  if (!el) return;
  if (!state.showMacros) { el.innerHTML = ""; return; }

  var st = dayTotals();
  var target = CALC_DAY_TARGETS[state.dayType];

  el.innerHTML =
    '<section style="max-width:1280px; margin:8px auto 0; padding:0 32px;">' +
      '<div style="background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;">' +
        '<div style="padding:24px 26px 18px; border-bottom:1px solid var(--border);">' +
          '<div style="font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--pink); margin-bottom:8px; font-weight:600;">Live Daily Macros</div>' +
          '<h2 style="font-family:var(--cond); font-size:34px; font-weight:700; text-transform:uppercase; color:#fff; margin:0; line-height:0.95;">Today’s Breakdown</h2>' +
          '<p style="font-size:14px; line-height:1.6; color:var(--text2); margin:12px 0 0; max-width:760px;">Tracking against <strong style="color:var(--text);">' + target.label + '</strong> — ' + target.protein + 'g P · ' + target.fat + 'g F · ' + target.carbs + 'g C · ' + target.calories + ' cal. Every bar turns red once you clear that day’s target. Fat splits into mono/polyunsaturated (the ones you want more of) vs. saturated (the ones to watch) — same split shown per food in the Custom Meal Calculator.</p>' +
        '</div>' +
        '<div style="padding:24px 26px 6px;">' +
          macroFullBar("Protein", "g", st.protein, target.protein, 10) +
          macroFatBar(st.fat, st.satFat, target.fat) +
          macroFullBar("Carbs", "g", st.carbs, target.carbs, 10) +
          macroFullBar("Calories", "", st.calories, target.calories, 50) +
        '</div>' +
      '</div>' +
    '</section>';

function selectDayType(dt) {
  state.dayType = dt;
  saveDayType();
  renderScoreboard();
}

function calcAddFood(foodId) {
  var food = calcFoodById(foodId);
  if (!food) return;
  var addQty;
  if (food.unit === "g") {
    var ozInput = $("calc-qty-" + foodId);
    var oz = ozInput ? parseFloat(ozInput.value) : NaN;
    if (!oz || oz <= 0) oz = 4;
    addQty = Math.round(oz * 28.3495);
  } else {
    addQty = 1;
  }
  var existing = state.dayLog.find(function (it) {
    return it.kind === "food" && it.refId === foodId && it.slot === state.calcSlotAssign;
  });
  if (existing) existing.qty += addQty;
  else state.dayLog.push({ uid: calcGenUid(), kind: "food", refId: foodId, qty: addQty, slot: state.calcSlotAssign });
  saveDayLog();
  renderGrid();
  renderScoreboard();
  renderTray();
}

function dayLogStep(uid, dir) {
  var item = state.dayLog.find(function (it) { return it.uid === uid; });
  if (!item) return;
  var step = 1;
  if (item.kind === "food") {
    var food = calcFoodById(item.refId);
    step = food && food.unit === "g" ? 25 : 1;
  }
  item.qty = Math.max(step, item.qty + dir * step);
  saveDayLog();
  renderGrid();
  renderScoreboard();
  renderTray();
}

function dayLogRemove(uid) {
  state.dayLog = state.dayLog.filter(function (it) { return it.uid !== uid; });
  saveDayLog();
  renderGrid();
  renderScoreboard();
  renderTray();
}

function dayLogSetSlot(uid, slot) {
  var item = state.dayLog.find(function (it) { return it.uid === uid; });
  if (!item) return;
  item.slot = slot;
  saveDayLog();
  renderTray();
}

function calcSetAddSlot(slot) { state.calcSlotAssign = slot; renderCalcFoodList(); }

function calcOnSearch(val) { state.calcSearch = val; renderCalcFoodList(); }

function calcToggleSaveBox() { state.calcShowSaveBox = !state.calcShowSaveBox; renderCalcSavedMeals(); }

function calcSaveMeal() {
  var name = (state.calcSaveName || "").trim();
  if (!name) return;
  var foodItems = state.dayLog.filter(function (it) { return it.kind === "food"; });
  if (foodItems.length === 0) return;
  state.calcSavedMeals.push({
    uid: calcGenUid(),
    name: name,
    items: foodItems.map(function (it) { return { foodId: it.refId, qty: it.qty, slot: it.slot }; })
  });
  saveCalcSavedMeals();
  state.calcSaveName = "";
  state.calcShowSaveBox = false;
  renderCalcSavedMeals();
}

function calcLoadSavedMeal(uid) {
  var meal = state.calcSavedMeals.find(function (m) { return m.uid === uid; });
  if (!meal) return;
  meal.items.forEach(function (it) {
    state.dayLog.push({ uid: calcGenUid(), kind: "food", refId: it.foodId, qty: it.qty, slot: it.slot });
  });
  saveDayLog();
  renderGrid();
  renderScoreboard();
  renderTray();
}

function calcDeleteSavedMeal(uid) {
  state.calcSavedMeals = state.calcSavedMeals.filter(function (m) { return m.uid !== uid; });
  saveCalcSavedMeals();
  renderCalcSavedMeals();
}

function calcSaveNameInput(val) { state.calcSaveName = val; }

// ---- rendering ----

function renderCalcFoodList() {
  var el = $("calcFoodListWrapper");
  if (!el) return;
  var q = state.calcSearch.trim().toLowerCase();
  var filtered = CALC_FOODS.filter(function (f) { return !q || f.name.toLowerCase().indexOf(q) !== -1; });

  if (filtered.length === 0) {
    el.innerHTML = '<div style="padding:20px 0; text-align:center; color:var(--text4); font-size:13.5px;">No foods match that search.</div>';
    return;
  }

  var html = CALC_CATEGORIES.map(function (cat) {
    var items = filtered.filter(function (f) { return f.category === cat; });
    if (items.length === 0) return "";
    var rows = items.map(function (f) {
      var unitLabel = f.unit === "g" ? "100g" : "1 " + (f.unitLabel || "×");
      var satShare = f.fat > 0 ? f.satFat / f.fat : 0;
      var satColor = satShare > 0.55 ? "var(--red)" : (satShare > 0 ? "var(--text3)" : "var(--text4)");
      var fatDisplay = f.fat + "g F<span style=\"color:" + satColor + ";\"> (" + f.satFat + "g sat)</span>";
      var addControl = f.unit === "g"
        ? '<div style="display:flex; align-items:center; gap:6px; flex:0 0 auto;">' +
            '<input type="number" id="calc-qty-' + f.id + '" value="4" min="0.5" step="0.5" inputmode="decimal" style="width:48px; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 4px; color:var(--text); font-family:var(--mono); font-size:11px; text-align:center;">' +
            '<span style="font-family:var(--mono); font-size:9px; color:var(--text3); text-transform:uppercase;">oz</span>' +
            '<button data-action="calc-add-food" data-food-id="' + f.id + '" class="hover-lime-fill" style="cursor:pointer; background:var(--lime); border:none; border-radius:8px; padding:7px 12px; color:#101214; font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;">+ Add</button>' +
          '</div>'
        : '<button data-action="calc-add-food" data-food-id="' + f.id + '" class="hover-lime-fill" style="cursor:pointer; flex:0 0 auto; background:var(--lime); border:none; border-radius:8px; padding:7px 12px; color:#101214; font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;">+ Add</button>';
      return '<div class="calc-food-row" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; margin-bottom:7px; flex-wrap:wrap;">' +
        '<div style="flex:1; min-width:180px;">' +
          '<div style="font-size:13.5px; font-weight:600; color:var(--text);">' + esc(f.name) + '</div>' +
          '<div style="font-family:var(--mono); font-size:10px; color:var(--text3); margin-top:2px;">per ' + unitLabel + ' · ' + f.protein + 'g P · ' + fatDisplay + ' · ' + f.carbs + 'g C · ' + f.calories + ' cal' + (f.note ? " · " + esc(f.note) : "") + '</div>' +
        '</div>' +
        addControl +
      '</div>';
    }).join("");
    return '<div style="margin-bottom:16px;">' +
      '<div style="font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3); margin-bottom:2px;">' + cat + '</div>' +
      rows +
    '</div>';
  }).join("");

  el.innerHTML = html;
}

  return "";

function renderScoreboard() {
  var st = dayTotals();
  var target = CALC_DAY_TARGETS[state.dayType];
  var zone = proteinZone(st.protein);
  var maxScale = target.protein + 60;
  var fillPct = Math.min((st.protein / maxScale) * 100, 100).toFixed(1) + "%";
  var floorPct = ((CALC_PROTEIN_FLOOR / maxScale) * 100).toFixed(1) + "%";

  var cntB = 0, cntL = 0, cntS = 0;
  state.dayLog.forEach(function (it) {
    if (it.kind !== "recipe") return;
    var m = MEALS.find(function (x) { return x.id === it.refId; });
    if (!m) return;
    if (m.section === "breakfast") cntB += it.qty;
    else if (m.section === "lunchdinner") cntL += it.qty;
    else if (m.section === "snacks" || m.section === "sweets") cntS += it.qty;
  });
  var structText = cntB + "B · " + cntL + "M · " + cntS + "S";
  var structColor = (cntB >= 1 && cntL >= 2 && cntS >= 2) ? "var(--lime)" : "var(--text3)";

  // Fat, carbs and calories are colored against today's selected day-type
  // target the same way the calculator's bars are, so the scoreboard flags
  // "you're already close to your fat budget" instead of just a raw number —
  // and the saturated portion is broken out separately underneath, since a
  // gram of olive oil isn't the same as a gram of butter.
  var calZone = calcMacroZone(st.calories, target.calories, 50);
  var carbZone = calcMacroZone(st.carbs, target.carbs, 10);
  var fatZone = calcMacroZone(st.fat, target.fat, 10);
  var satShare = st.fat > 0 ? st.satFat / st.fat : 0;
  var satColor = satShare > 0.55 ? "var(--red)" : "var(--text3)";

  var trayLabel = state.trayOpen ? "Hide day" : "View day";

  var desktopHtml =

function buildBinder() {
  var coverStats = [
    { label: "Breakfast", count: MEALS.filter(function (m) { return m.section === "breakfast"; }).length },
    { label: "Lunch / Dinner", count: MEALS.filter(function (m) { return m.section === "lunchdinner"; }).length },
    { label: "Snacks", count: MEALS.filter(function (m) { return m.section === "snacks"; }).length },
    { label: "Sweets", count: MEALS.filter(function (m) { return m.section === "sweets"; }).length }
  ];
  var coverStatsHtml = coverStats.map(function (c) {
    return '<div><div style="font-size:38px; font-weight:700; color:#14161a; line-height:1;">' + c.count + '</div><div style="font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:#8b9096;">' + esc(c.label) + '</div></div>';
  }).join("");

  var html = '<div style="page-break-after:always; height:9.6in; display:flex; flex-direction:column; justify-content:center; padding:0 0.9in;">' +
    '<div style="font-family:var(--mono); font-size:12px; letter-spacing:0.24em; text-transform:uppercase; color:#5f8f12; margin-bottom:18px; font-weight:600;">Recomp Fuel · 180g+ protein / day</div>' +
    '<div style="font-family:var(--cond); font-size:92px; line-height:0.9; font-weight:700; text-transform:uppercase; color:#14161a;">Meal Plan</div>' +
    '<div style="font-size:16px; line-height:1.6; color:#4a4f57; max-width:5.5in; margin-top:22px;">Any 1 breakfast + 2 lunch/dinner + 2 snacks clears 180g of protein. No onions, no mushrooms. ' + MEALS.length + ' meals across four tabbed sections.</div>' +
    '<div style="margin-top:32px; display:flex; gap:24px; font-family:var(--cond);">' + coverStatsHtml + '</div>' +
  '</div>';

  SEC_DEFS.forEach(function (sec) {
    var list = MEALS.filter(function (m) { return m.section === sec.id; });
    html += '<div style="page-break-after:always; height:9.6in; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; background:#14161a;">' +
      '<div style="font-family:var(--mono); font-size:14px; letter-spacing:0.3em; text-transform:uppercase; color:#c6ff4a; margin-bottom:14px; font-weight:600;">' + esc(sec.tab) + '</div>' +
      '<div style="font-family:var(--cond); font-size:96px; font-weight:700; text-transform:uppercase; color:#fff; line-height:0.9;">' + esc(sec.label) + '</div>' +
      '<div style="font-family:var(--mono); font-size:13px; color:#8b9096; margin-top:16px;">' + list.length + ' recipes · min ' + sec.floor + 'g protein each</div>' +
    '</div>';
    list.forEach(function (m, i) {
      html += buildBinderRecipePage(m, String(i + 1).padStart(2, "0"), sec);
    });
  });

  $("binder-root").innerHTML = html;
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------

function toggleDrive() { state.showDrive = !state.showDrive; renderHeader(); renderPanels(); }
function toggleDayTargets() { state.showDayTargets = !state.showDayTargets; renderHeader(); renderPanels(); }

function selectSection(id) { state.activeSection = id; renderControls(); renderGrid(); }
function toggleCollection(id) {
  var i = state.activeCollections.indexOf(id);
  if (i === -1) state.activeCollections.push(id); else state.activeCollections.splice(i, 1);
  renderControls(); renderGrid();
}
function clearCollections() { state.activeCollections = []; renderControls(); renderGrid(); }

function onSearch(val) { state.search = val; renderGrid(); }

function toggleExpandAll() { state.expandAll = !state.expandAll; state.expandedId = null; renderControls(); renderGrid(); }
function toggleExpand(id) { state.expandedId = (state.expandedId === id) ? null : id; renderGrid(); }

function addMeal(id) {
  var existing = state.dayLog.find(function (it) { return it.kind === "recipe" && it.refId === id; });
  if (existing) existing.qty++;
  else state.dayLog.push({ uid: calcGenUid(), kind: "recipe", refId: id, qty: 1, slot: null });
  saveDayLog();
  renderGrid(); renderScoreboard(); renderTray();
}
function clearDay() { state.dayLog = []; saveDayLog(); state.trayOpen = false; renderGrid(); renderScoreboard(); renderTray(); }
function toggleTray() { state.trayOpen = !state.trayOpen; renderScoreboard(); renderTray(); }

function flashMsg(msg) {
  state.syncMsg = msg;
  renderTray();
  clearTimeout(flashMsg._t);
  flashMsg._t = setTimeout(function () { state.syncMsg = ""; renderTray(); }, 3500);
}
function fallbackCopy(text) {
  var ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.focus(); ta.select();
  try { document.execCommand("copy"); } catch (e) {}
  document.body.removeChild(ta);
}
function copyForSheets() {
  if (state.dayLog.length === 0) { flashMsg("Add meals or foods to your day first."); return; }
  var d = sheetsPayload();
  var row = [d.date, d.protein, d.calories, d.carbs, d.fat, d.names.join("; ")].join("\t");
  var done = function () { flashMsg("Copied — paste one row into your Sheet."); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(row).then(done, function () { fallbackCopy(row); done(); });
    } else { fallbackCopy(row); done(); }
  } catch (e) { fallbackCopy(row); done(); }
}
function toggleSyncSetup() { state.showSyncSetup = !state.showSyncSetup; renderTray(); }
function saveSheetUrl(val) {
  state.sheetUrl = val.trim();
  saveSheetUrlToStorage();
}
function logToSheets() {
  if (!state.sheetUrl) { state.showSyncSetup = true; renderTray(); return; }
  if (state.dayLog.length === 0) { flashMsg("Add meals or foods to your day first."); return; }
  var payload = sheetsPayload();
  flashMsg("Logging…");
  fetch(state.sheetUrl, { method: "POST", mode: "no-cors", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify(payload) })
    .then(function () { flashMsg("Logged to your Sheet ✓"); })
    .catch(function () { flashMsg("Couldn't reach the Sheet — check the URL."); });
}

function printBinder() {
  state.binderMode = true;
  buildBinder();
  requestAnimationFrame(function () {
    requestAnimationFrame(function () {
      setTimeout(function () { try { window.print(); } catch (e) {} }, 400);
    });
  });
}
window.addEventListener("afterprint", function () {
  state.binderMode = false;
  $("binder-root").innerHTML = "";
});

// ---------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch (action) {
    case "toggle-drive": toggleDrive(); break;
    case "toggle-day-targets": toggleDayTargets(); break;
    case "select-tab": selectSection(el.getAttribute("data-section")); break;
    case "toggle-collection": toggleCollection(el.getAttribute("data-collection")); break;
    case "clear-collections": clearCollections(); break;
    case "toggle-expand-all": toggleExpandAll(); break;
    case "print-binder": printBinder(); break;
    case "toggle-expand": toggleExpand(id); break;
    case "add-to-day": addMeal(id); break;
    case "clear-day": clearDay(); break;
    case "daylog-step": dayLogStep(el.getAttribute("data-uid"), parseInt(el.getAttribute("data-dir"), 10)); break;
    case "daylog-remove": dayLogRemove(el.getAttribute("data-uid")); break;
    case "toggle-tray": toggleTray(); break;
    case "copy-for-sheets": copyForSheets(); break;
    case "log-to-sheets": logToSheets(); break;
    case "toggle-sync-setup": toggleSyncSetup(); break;
    case "ack-disclaimer": ackDisclaimer(); break;
    case "toggle-calculator": toggleCalculator(); break;
    case "toggle-macros": toggleMacros(); break;
    case "select-daytype": selectDayType(el.getAttribute("data-daytype")); break;
    case "calc-add-food": calcAddFood(el.getAttribute("data-food-id")); break;
    case "calc-toggle-save-box": calcToggleSaveBox(); break;
    case "calc-save-meal": calcSaveMeal(); break;
    case "calc-load-saved": calcLoadSavedMeal(el.getAttribute("data-uid")); break;
    case "calc-delete-saved": calcDeleteSavedMeal(el.getAttribute("data-uid")); break;
  }
});

document.addEventListener("input", function (e) {
  if (e.target.id === "searchInput") onSearch(e.target.value);
  if (e.target.id === "sheetUrlInput") saveSheetUrl(e.target.value);
  if (e.target.id === "calcSearchInput") calcOnSearch(e.target.value);
  if (e.target.id === "calcSaveNameInput") calcSaveNameInput(e.target.value);
});

document.addEventListener("change", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  if (action === "daylog-set-slot") dayLogSetSlot(el.getAttribute("data-uid"), el.value || null);
  if (action === "calc-set-add-slot") calcSetAddSlot(el.value);
});

          '<button data-action="print-binder" class="hover-lime-fill" style="cursor:pointer; background:var(--lime); border:1px solid var(--lime); border-radius:10px; padding:10px 14px; color:#101214; font-family:var(--mono); font-size:11px; letter-spacing:0.1em; text-transform:uppercase; font-weight:700;">Print binder</button>' +
        '</div>' +
      '</div>' +
    '</div>' +

    '<main style="max-width:1280px; margin:0 auto; padding:12px 32px 40px;">' +
      '<div id="gridWrapper"></div>' +
    '</main>' +

    '<div id="trayContainer"></div>' +

    '<div id="scoreboardContainer" style="position:fixed; left:0; right:0; bottom:0; z-index:50; background:#0b0d0e; border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom, 0px);"></div>';
}

function renderAll() {
  renderDisclaimer();
  renderHeader();
  renderPanels();
  renderControls();
  renderGrid();
  renderScoreboard();
  renderTray();
}

loadPersisted();
mountShell();
renderAll();

})();

</script>
</body>
