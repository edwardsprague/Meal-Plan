<style>
  /* No external fonts — this app must work with zero network connectivity.
     System font stacks are chosen to read close to the original design
     (condensed/bold headers, monospace labels) without ever fetching anything. */
  :root{
    --bg:#f7f6f2; --card:#ffffff; --card2:#f0efe8; --panel2:#eae8df;
    --border:#e2e0d5; --border-hover:#c7c4b4;
    --text:#24271f; --text2:#5b5f52; --text3:#75786a; --text4:#9b9d8e;
    --lime:#52734a; --blue:#3f6f8f; --pink:#a15577; --orange:#9c6a1f; --red:#b23b3b;
    --mono:ui-monospace,'SF Mono','Menlo','Consolas','Roboto Mono',monospace;
    --cond:-apple-system,'SF Pro Condensed','Roboto Condensed','Arial Narrow',system-ui,sans-serif;
    --body:-apple-system,'SF Pro Text',system-ui,'Segoe UI',Roboto,sans-serif;
  }
  html,body{ margin:0; padding:0; background:var(--bg); }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ font-family:var(--body); color:var(--text); }
  ::selection{ background:var(--lime); color:#fff; }
  input::placeholder{ color:var(--text4); }
  input{ font-family:inherit; }
  input:focus{ outline:none; border-color:var(--lime) !important; box-shadow:0 0 0 3px rgba(82,115,74,0.16); }
  button{ font-family:inherit; -webkit-user-select:none; user-select:none; }
  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:#f0efe8; }
  ::-webkit-scrollbar-thumb{ background:#d3d0c2; border-radius:6px; }
  @keyframes trayUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
  @keyframes fadeSlideIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:0.001ms !important; transition-duration:0.001ms !important; }
  }

  a{ color:inherit; }

  /* Smoothness: every tappable thing gets a quick, consistent response instead
     of the default (and on iOS, ugly) tap-flash, plus a subtle press-down. */
  button, .card, .chip-btn, .tab-btn, .qty-btn, .sample-btn, .calc-food-row{
    transition:border-color 0.15s ease, background-color 0.15s ease, color 0.15s ease, transform 0.1s ease, opacity 0.15s ease, box-shadow 0.18s ease;
  }
  button:active, .qty-btn:active{ transform:scale(0.95); }
  .card:active{ transform:scale(0.995); }
  .recipe-fade{ animation:fadeSlideIn 0.18s ease; }

  .hover-border:hover{ border-color:var(--border-hover) !important; }
  .hover-lime:hover{ border-color:var(--lime) !important; }
  .hover-blue:hover{ border-color:var(--blue) !important; }
  .hover-orange:hover{ border-color:var(--orange) !important; }
  .hover-pink:hover{ border-color:var(--pink) !important; }
  .hover-lime-text:hover{ border-color:var(--lime) !important; color:var(--lime) !important; }
  .hover-red:hover{ border-color:var(--red) !important; color:var(--red) !important; }
  .hover-lime-fill{ box-shadow:0 2px 8px rgba(82,115,74,0.14); }
  .hover-lime-fill:hover{ background:#435f3c !important; box-shadow:0 4px 14px rgba(82,115,74,0.22); transform:translateY(-1px); }
  .hover-step:hover{ border-color:var(--lime) !important; }
  .card-action-btn:hover{ color:var(--text) !important; background:var(--card2) !important; }

  .tab-btn{ cursor:pointer; position:relative; background:none; border:none; padding:8px 4px; margin-right:14px; font-family:var(--cond); font-size:22px; font-weight:600; text-transform:uppercase; letter-spacing:0.02em; }
  .chip-btn{ cursor:pointer; align-self:center; border-radius:20px; padding:6px 13px; margin-right:8px; font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:0.06em; text-transform:uppercase; }
  .card{ background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden; display:flex; flex-direction:column; box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 10px 24px -16px rgba(0,0,0,0.10); }
  .macro-chip{ flex:1; background:var(--card2); border-radius:8px; padding:8px 10px; text-align:center; }
  .tag-chip{ font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text2); border:1px solid var(--border); padding:3px 8px; border-radius:20px; }
  .qty-btn{ cursor:pointer; width:30px; height:30px; border-radius:8px; background:var(--card2); border:1px solid var(--border); color:var(--text); font-size:18px; line-height:1; }
  .calc-food-row{ background:var(--card2); border:1px solid var(--border); border-radius:10px; }

  [style*="border-radius:16px; overflow:hidden;"]{ box-shadow:0 1px 2px rgba(0,0,0,0.04), 0 12px 28px -18px rgba(0,0,0,0.10); }
  #scoreboardContainer{ box-shadow:0 -10px 22px -12px rgba(0,0,0,0.08); }

  .sb-mobile{ display:none; }

  @media (hover:hover){
    .card:hover{ border-color:var(--border-hover); box-shadow:0 2px 6px rgba(0,0,0,0.05), 0 18px 36px -18px rgba(0,0,0,0.12); transform:translateY(-2px); }
    .tab-btn:hover{ color:var(--lime) !important; }
    .chip-btn:hover{ filter:brightness(0.94); }
    .calc-food-row:hover{ border-color:var(--border-hover); background:#e9e7dd; }
  }

  @media (max-width: 640px){
    header{ padding:26px 18px 10px !important; }
    header h1{ font-size:clamp(30px, 11vw, 46px) !important; }
    header > div:nth-of-type(1){ font-size:10px !important; margin-bottom:10px !important; }
    header p{ font-size:14.5px !important; margin-top:12px !important; }
    section, main, #controlsBar{ padding-left:18px !important; padding-right:18px !important; }
    main{ padding-top:6px !important; padding-bottom:24px !important; }
    main #gridWrapper > div[style*="grid-template-columns"]{ grid-template-columns:1fr !important; gap:12px !important; }
    #searchInput{ width:100% !important; flex:1 1 100%; }
    #tabsCollectionsRow{ gap:4px !important; }
    .tab-btn{ font-size:18px !important; margin-right:10px !important; }
    .chip-btn{ font-size:10px !important; padding:5px 10px !important; }

    /* Cards: trim the oversized display type down to something that reads
       calm on a phone instead of shouting. */
    .card h3{ font-size:19px !important; }
    .pp-card-protein{ font-size:30px !important; }
    .pp-card-macro-num{ font-size:16px !important; }
    .card > div:first-child{ padding:16px 16px 14px !important; }

    /* Footer: swap the roomy desktop scoreboard for the compact single-column one. */
    .sb-desktop{ display:none !important; }
    .sb-mobile{ display:block !important; }
  }

  @page{ size:letter; margin:0.5in; }
  @media print{
    [data-noprint]{ display:none !important; }
    html, body{ background:#fff !important; }
    [data-binder]{ display:block !important; }
    [data-binder], [data-binder] *{ -webkit-print-color-adjust:exact !important; print-color-adjust:exact !important; }
  }
</style>
</head>

// Generic ingredients get calories derived from macros (P*4 + C*4 + F*9) — the
// standard approach, since there's no single "real" label behind a generic
// entry to match. Branded/packaged foods set `calories` explicitly above
// instead, matching their actual printed nutrition label exactly (which
// accounts for fiber the way the flat formula doesn't).
CALC_FOODS.forEach(function (f) { if (f.calories == null) f.calories = Math.round(f.protein * 4 + f.carbs * 4 + f.fat * 9); });

var CALC_CATEGORIES = ["Protein", "Carbs", "Fats & Dairy", "Vegetables", "Fruits", "Seasonings", "Sauces & Condiments", "Beverages", "Presets"];

// Targets are daily totals. Protein floor is a hard 185g minimum on either day type.
// Edward dropped the Lift/Run day split (2026-11-23) — total calories and
// macros only now, no training-day distinction. One flat daily target.
var DAILY_TARGET = { label: "Daily Target", protein: 200, fat: 65, carbs: 230, calories: 2305, color: "var(--lime)" };
var CALC_PROTEIN_FLOOR = 185;

var CALC_SLOTS = ["Breakfast", "Lunch", "Dinner", "Snack 1", "Snack 2"];

var state = {
  // dayLog is the running total for today — every entry comes from the
  // Custom Meal Calculator (kind:"food"), weighed out and logged by hand.
  dayLog: [],
  trayOpen: false,
  showDrive: false,
  showDisclaimer: true,
  showMacros: false,
  calcSlotAssign: "Breakfast",
  calcWeightUnit: "oz",
  calcSearch: "",
  calcSavedMeals: [],
  calcShowSaveBox: false,
  calcSaveName: ""
};

function loadPersisted() {
  try {
    var saved = JSON.parse(localStorage.getItem("protein-playbook-daylog-v1") || "[]");
    if (Array.isArray(saved)) state.dayLog = saved;
  } catch (e) {}
  try {
    if (localStorage.getItem("protein-playbook-disclaimer-ack-v1") === "1") state.showDisclaimer = false;
  } catch (e) {}
  try {
    var savedMeals = JSON.parse(localStorage.getItem("protein-playbook-calc-saved-v1") || "[]");
    if (Array.isArray(savedMeals)) state.calcSavedMeals = savedMeals;
  } catch (e) {}
  try {
    var wu = localStorage.getItem("protein-playbook-calc-weightunit-v1");
    if (wu === "g" || wu === "oz") state.calcWeightUnit = wu;
  } catch (e) {}
}
function ackDisclaimer() {
  state.showDisclaimer = false;
  try { localStorage.setItem("protein-playbook-disclaimer-ack-v1", "1"); } catch (e) {}
  renderDisclaimer();
}
function saveDayLog() {
  try { localStorage.setItem("protein-playbook-daylog-v1", JSON.stringify(state.dayLog)); } catch (e) {}
}
function saveCalcSavedMeals() {
  try { localStorage.setItem("protein-playbook-calc-saved-v1", JSON.stringify(state.calcSavedMeals)); } catch (e) {}
}

// ---------------------------------------------------------------------
// Utilities
// ---------------------------------------------------------------------

function esc(str) {
  return String(str == null ? "" : str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}
function $(id) { return document.getElementById(id); }

// ---------------------------------------------------------------------
// Derived business logic (mirrors the design's renderVals())
// ---------------------------------------------------------------------

function dayLogItemMacros(item) {
  var food = calcFoodById(item.refId);
  if (!food) return { protein: 0, fat: 0, carbs: 0, calories: 0, satFat: 0 };
  var factor = food.unit === "g" ? (item.qty / 100) : item.qty;
  return {
    protein: food.protein * factor, fat: food.fat * factor, carbs: food.carbs * factor,
    calories: food.calories * factor, satFat: (food.satFat || 0) * factor
  };
}

function dayLogItemLabel(item) {
  var food = calcFoodById(item.refId);
  return food ? food.name : item.refId;
}

function dayTotals() {
  var t = { protein: 0, fat: 0, carbs: 0, calories: 0, satFat: 0 };
  state.dayLog.forEach(function (it) {
    var m = dayLogItemMacros(it);
    t.protein += m.protein; t.fat += m.fat; t.carbs += m.carbs; t.calories += m.calories; t.satFat += m.satFat;
  });
  return { protein: Math.round(t.protein), fat: Math.round(t.fat), carbs: Math.round(t.carbs), calories: Math.round(t.calories), satFat: Math.round(t.satFat) };
}

function proteinZone(protein) {
  var target = DAILY_TARGET;
  if (protein === 0) return { label: "Empty", color: "var(--text4)", hint: "Add meals or foods to start building your day." };
  if (protein < CALC_PROTEIN_FLOOR) return { label: "Under floor", color: "var(--red)", hint: (CALC_PROTEIN_FLOOR - protein) + "g under the " + CALC_PROTEIN_FLOOR + "g hard floor." };
  if (protein < target.protein) return { label: "Under target", color: "#7c9468", hint: (target.protein - protein) + "g under your " + target.label + " target." };
  if (protein <= target.protein + 30) return { label: "On target", color: "var(--lime)", hint: "Clears the floor and on target for " + target.label + "." };
  return { label: "Loaded", color: "var(--blue)", hint: "Well past target — plenty of protein banked." };
}

// ---------------------------------------------------------------------
// Custom Meal Calculator — logic
// ---------------------------------------------------------------------

function calcFoodById(id) { return CALC_FOODS.find(function (f) { return f.id === id; }); }

function calcMacroZone(current, target, tolerance) {
  var remaining = target - current;
  if (remaining < 0) return { color: "var(--red)", label: "over" };
  if (remaining <= tolerance) return { color: "var(--lime)", label: "near" };
  return { color: "var(--text3)", label: "under" };
}

function calcBar(label, unit, current, target, tolerance) {
  var zone = calcMacroZone(current, target, tolerance);
  var pct = Math.min((current / target) * 100, 100).toFixed(1) + "%";
  var remaining = target - current;
  var remainingText = remaining >= 0
    ? (remaining + unit + " " + label.toLowerCase() + " remaining")
    : (Math.abs(remaining) + unit + " over target");
  return '<div>' +
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:5px;">' +
      '<span style="font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase; color:var(--text3);">' + esc(label) + '</span>' +
      '<span style="font-family:var(--cond); font-size:15px; font-weight:600; color:' + zone.color + ';">' + current + unit + '<span style="color:var(--text4); font-weight:400;"> / ' + target + unit + '</span></span>' +
    '</div>' +
    '<div style="position:relative; height:8px; background:var(--card2); border-radius:20px; overflow:hidden;">' +
      '<div style="height:100%; width:' + pct + '; background:' + zone.color + '; border-radius:20px; transition:width 0.3s ease;"></div>' +
    '</div>' +
    '<div style="font-family:var(--mono); font-size:10.5px; color:' + (remaining < 0 ? "var(--red)" : "var(--text3)") + '; margin-top:4px;">' + remainingText + '</div>' +
  '</div>';
}

function calcGenUid() { return "ci" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function toggleMacros() {
  state.showMacros = !state.showMacros;
  renderHeader();
  renderMacrosPanel();
  if (state.showMacros) { var el = $("macrosContainer"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

// Full-width interactive bar for Protein / Carbs / Calories — turns red past target.
function macroFullBar(label, unit, current, target, tolerance) {
  var zone = calcMacroZone(current, target, tolerance);
  var pct = Math.min((current / target) * 100, 100).toFixed(1) + "%";
  var remaining = target - current;
  var remainingText = remaining >= 0
    ? (remaining + unit + " " + label.toLowerCase() + " remaining")
    : (Math.abs(remaining) + unit + " over your " + label.toLowerCase() + " target");
  return '<div style="margin-bottom:22px;">' +
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;">' +
      '<span style="font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3);">' + esc(label) + '</span>' +
      '<span style="font-family:var(--cond); font-size:19px; font-weight:700; color:' + zone.color + ';">' + current + unit + '<span style="color:var(--text4); font-weight:400; font-size:14px;"> / ' + target + unit + '</span></span>' +
    '</div>' +
    '<div style="position:relative; height:10px; background:var(--card2); border-radius:20px; overflow:hidden;">' +
      '<div style="height:100%; width:' + pct + '; background:' + zone.color + '; border-radius:20px; transition:width 0.3s ease;"></div>' +
    '</div>' +
    '<div style="font-family:var(--mono); font-size:11px; color:' + (remaining < 0 ? "var(--red)" : "var(--text3)") + '; margin-top:6px;">' + remainingText + '</div>' +
  '</div>';
}

// Fat gets its own bar, split into unsaturated (the ones you want more of) and
// saturated (the ones to watch) — the split shows composition regardless of
// total, while the number itself turns red once total fat clears the target.
function macroFatBar(current, satCurrent, target) {
  var unsatCurrent = Math.max(current - satCurrent, 0);
  var overTarget = current > target;
  var totalPct = Math.min((current / target) * 100, 100);
  var unsatPct = current > 0 ? (unsatCurrent / current) * totalPct : 0;
  var satPct = current > 0 ? (satCurrent / current) * totalPct : 0;
  var remaining = target - current;
  var remainingText = remaining >= 0 ? (remaining + "g fat remaining") : (Math.abs(remaining) + "g over your fat target");
  return '<div style="margin-bottom:22px;">' +
    '<div style="display:flex; justify-content:space-between; align-items:baseline; margin-bottom:7px;">' +
      '<span style="font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3);">Fat</span>' +
      '<span style="font-family:var(--cond); font-size:19px; font-weight:700; color:' + (overTarget ? "var(--red)" : "var(--text)") + ';">' + current + 'g<span style="color:var(--text4); font-weight:400; font-size:14px;"> / ' + target + 'g</span></span>' +
    '</div>' +
    '<div style="position:relative; height:10px; background:var(--card2); border-radius:20px; overflow:hidden; display:flex;">' +
      '<div style="height:100%; width:' + unsatPct.toFixed(1) + '%; background:var(--lime); transition:width 0.3s ease;"></div>' +
      '<div style="height:100%; width:' + satPct.toFixed(1) + '%; background:var(--orange); transition:width 0.3s ease;"></div>' +
    '</div>' +
    '<div style="display:flex; justify-content:space-between; margin-top:6px; font-family:var(--mono); font-size:11px; flex-wrap:wrap; gap:6px;">' +
      '<span style="color:var(--text3);"><span style="color:var(--lime);">■</span> ' + unsatCurrent + 'g unsaturated <span style="color:var(--orange); margin-left:10px;">■</span> ' + satCurrent + 'g saturated</span>' +
      '<span style="color:' + (remaining < 0 ? "var(--red)" : "var(--text3)") + ';">' + remainingText + '</span>' +
    '</div>' +
  '</div>';
}

function renderMacrosPanel() {
  var el = $("macrosContainer");
  if (!el) return;
  if (!state.showMacros) { el.innerHTML = ""; return; }

  var st = dayTotals();
  var target = DAILY_TARGET;

  el.innerHTML =
    '<section style="max-width:1280px; margin:8px auto 0; padding:0 32px;">' +

        '<div style="padding:24px 26px 18px; border-bottom:1px solid var(--border);">' +
          '<div style="font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--pink); margin-bottom:8px; font-weight:600;">Live Daily Macros</div>' +
          '<h2 style="font-family:var(--cond); font-size:34px; font-weight:700; text-transform:uppercase; color:var(--text); margin:0; line-height:0.95;">Today’s Breakdown</h2>' +
          '<p style="font-size:14px; line-height:1.6; color:var(--text2); margin:12px 0 0; max-width:760px;">Tracking against <strong style="color:var(--text);">' + target.label + '</strong> — ' + target.protein + 'g P · ' + target.fat + 'g F · ' + target.carbs + 'g C · ' + target.calories + ' cal. Every bar turns red once you clear that day’s target. Fat splits into mono/polyunsaturated (the ones you want more of) vs. saturated (the ones to watch) — same split shown per food in the Custom Meal Calculator.</p>' +
        '</div>' +
        '<div style="padding:24px 26px 6px;">' +
          macroFullBar("Protein", "g", st.protein, target.protein, 10) +
          macroFatBar(st.fat, st.satFat, target.fat) +
          macroFullBar("Carbs", "g", st.carbs, target.carbs, 10) +
          macroFullBar("Calories", "", st.calories, target.calories, 50) +
        '</div>' +
      '</div>' +
    '</section>';
}

function calcAddFood(foodId) {
  var food = calcFoodById(foodId);
  if (!food) return;
  var addQty;
  if (food.unit === "g") {
    var qtyInput = $("calc-qty-" + foodId);
    var raw = qtyInput ? parseFloat(qtyInput.value) : NaN;
    if (state.calcWeightUnit === "g") {
      if (!raw || raw <= 0) raw = 100;
      addQty = Math.round(raw);
    } else {
      if (!raw || raw <= 0) raw = 4;
      addQty = Math.round(raw * 28.3495);
    }
  } else {
    addQty = 1;
  }
  var existing = state.dayLog.find(function (it) {
    return it.kind === "food" && it.refId === foodId && it.slot === state.calcSlotAssign;
  });
  if (existing) existing.qty += addQty;
  else state.dayLog.push({ uid: calcGenUid(), kind: "food", refId: foodId, qty: addQty, slot: state.calcSlotAssign });
  saveDayLog();
  renderScoreboard();
  renderTray();
}

function dayLogStep(uid, dir) {
  var item = state.dayLog.find(function (it) { return it.uid === uid; });
  if (!item) return;
  var step = 1;
  if (item.kind === "food") {
    var food = calcFoodById(item.refId);
    step = food && food.unit === "g" ? 25 : 1;
  }
  item.qty = Math.max(step, item.qty + dir * step);
  saveDayLog();
  renderScoreboard();
  renderTray();
}

function dayLogRemove(uid) {
  state.dayLog = state.dayLog.filter(function (it) { return it.uid !== uid; });
  saveDayLog();
  renderScoreboard();
  renderTray();
}

function dayLogSetSlot(uid, slot) {
  var item = state.dayLog.find(function (it) { return it.uid === uid; });
  if (!item) return;
  item.slot = slot;
  saveDayLog();
  renderTray();
}

function calcSetAddSlot(slot) { state.calcSlotAssign = slot; renderCalcFoodList(); }

function calcSetWeightUnit(unit) {
  if (unit !== "g" && unit !== "oz") return;
  state.calcWeightUnit = unit;
  try { localStorage.setItem("protein-playbook-calc-weightunit-v1", unit); } catch (e) {}
  renderCalcFoodList();
}

function calcOnSearch(val) { state.calcSearch = val; renderCalcFoodList(); }

function calcToggleSaveBox() { state.calcShowSaveBox = !state.calcShowSaveBox; renderCalcSavedMeals(); }

function calcSaveMeal() {
  var name = (state.calcSaveName || "").trim();
  if (!name) return;
  var foodItems = state.dayLog.filter(function (it) { return it.kind === "food"; });
  if (foodItems.length === 0) return;
  state.calcSavedMeals.push({
    uid: calcGenUid(),
    name: name,
    items: foodItems.map(function (it) { return { foodId: it.refId, qty: it.qty, slot: it.slot }; })
  });
  saveCalcSavedMeals();
  state.calcSaveName = "";
  state.calcShowSaveBox = false;
  renderCalcSavedMeals();
}

function calcLoadSavedMeal(uid) {
  var meal = state.calcSavedMeals.find(function (m) { return m.uid === uid; });
  if (!meal) return;
  meal.items.forEach(function (it) {
    state.dayLog.push({ uid: calcGenUid(), kind: "food", refId: it.foodId, qty: it.qty, slot: it.slot });
  });
  saveDayLog();
  renderScoreboard();
  renderTray();
}

function calcDeleteSavedMeal(uid) {
  state.calcSavedMeals = state.calcSavedMeals.filter(function (m) { return m.uid !== uid; });
  saveCalcSavedMeals();
  renderCalcSavedMeals();
}

function calcSaveNameInput(val) { state.calcSaveName = val; }

// ---- rendering ----

function renderCalcFoodList() {
  var el = $("calcFoodListWrapper");
  if (!el) return;
  var q = state.calcSearch.trim().toLowerCase();
  var filtered = CALC_FOODS.filter(function (f) { return !q || f.name.toLowerCase().indexOf(q) !== -1; });

  if (filtered.length === 0) {
    el.innerHTML = '<div style="padding:20px 0; text-align:center; color:var(--text4); font-size:13.5px;">No foods match that search.</div>';
    return;
  }

  var html = CALC_CATEGORIES.map(function (cat) {
    var items = filtered.filter(function (f) { return f.category === cat; });
    if (items.length === 0) return "";
    var rows = items.map(function (f) {
      var unitLabel = f.unit === "g" ? "100g" : "1 " + (f.unitLabel || "×");
      var satShare = f.fat > 0 ? f.satFat / f.fat : 0;
      var satColor = satShare > 0.55 ? "var(--red)" : (satShare > 0 ? "var(--text3)" : "var(--text4)");
      var fatDisplay = f.fat + "g F<span style=\"color:" + satColor + ";\"> (" + f.satFat + "g sat)</span>";
      var wu = state.calcWeightUnit;
      var wuDefault = wu === "g" ? "100" : "4";
      var wuStep = wu === "g" ? "5" : "0.5";
      var wuMin = wu === "g" ? "1" : "0.5";
      var addControl = f.unit === "g"
        ? '<div style="display:flex; align-items:center; gap:6px; flex:0 0 auto;">' +
            '<input type="number" id="calc-qty-' + f.id + '" value="' + wuDefault + '" min="' + wuMin + '" step="' + wuStep + '" inputmode="decimal" style="width:48px; background:var(--card); border:1px solid var(--border); border-radius:6px; padding:6px 4px; color:var(--text); font-family:var(--mono); font-size:11px; text-align:center;">' +
            '<span style="font-family:var(--mono); font-size:9px; color:var(--text3); text-transform:uppercase;">' + wu + '</span>' +
            '<button data-action="calc-add-food" data-food-id="' + f.id + '" class="hover-lime-fill" style="cursor:pointer; background:var(--lime); border:none; border-radius:8px; padding:7px 12px; color:#101214; font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;">+ Add</button>' +
          '</div>'
        : '<button data-action="calc-add-food" data-food-id="' + f.id + '" class="hover-lime-fill" style="cursor:pointer; flex:0 0 auto; background:var(--lime); border:none; border-radius:8px; padding:7px 12px; color:#101214; font-family:var(--mono); font-size:10.5px; letter-spacing:0.06em; text-transform:uppercase; font-weight:700;">+ Add</button>';
      return '<div class="calc-food-row" style="display:flex; align-items:center; justify-content:space-between; gap:10px; padding:11px 13px; margin-bottom:7px; flex-wrap:wrap;">' +
        '<div style="flex:1; min-width:180px;">' +
          '<div style="font-size:13.5px; font-weight:600; color:var(--text);">' + esc(f.name) + '</div>' +
          '<div style="font-family:var(--mono); font-size:10px; color:var(--text3); margin-top:2px;">per ' + unitLabel + ' · ' + f.protein + 'g P · ' + fatDisplay + ' · ' + f.carbs + 'g C · ' + f.calories + ' cal' + (f.note ? " · " + esc(f.note) : "") + '</div>' +
        '</div>' +
        addControl +
      '</div>';
    }).join("");
    return '<div style="margin-bottom:16px;">' +
      '<div style="font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--text3); margin-bottom:2px;">' + cat + '</div>' +
      rows +
    '</div>';
  }).join("");

  el.innerHTML = html;
}

function renderCalcSavedMeals() {
  var el = $("calcSavedMealsWrapper");
  if (!el) return;

  var listHtml = state.calcSavedMeals.length === 0
    ? '<div style="font-size:13px; color:var(--text4);">No saved meals yet.</div>'
    : state.calcSavedMeals.map(function (m) {
        return '<div style="display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid #e2e0d5;">' +
          '<div style="flex:1; font-size:13.5px; font-weight:600; color:var(--text);">' + esc(m.name) + ' <span style="font-family:var(--mono); font-size:10.5px; color:var(--text3); font-weight:400;">(' + m.items.length + ' items)</span></div>' +
          '<button data-action="calc-load-saved" data-uid="' + m.uid + '" class="hover-lime-text" style="cursor:pointer; background:none; border:1px solid var(--border); border-radius:7px; padding:6px 11px; color:var(--text2); font-family:var(--mono); font-size:10px; letter-spacing:0.04em; text-transform:uppercase;">Load</button>' +
          '<button data-action="calc-delete-saved" data-uid="' + m.uid + '" class="hover-red" style="cursor:pointer; background:none; border:1px solid var(--border); border-radius:7px; width:28px; height:28px; color:var(--text3); font-size:13px;">✕</button>' +
        '</div>';
      }).join("");

  var saveBoxHtml = state.calcShowSaveBox
    ? '<div style="display:flex; gap:8px; margin-top:10px;">' +
        '<input type="text" id="calcSaveNameInput" placeholder="Name this combo…" value="' + esc(state.calcSaveName) + '" style="flex:1; background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:8px 12px; color:var(--text); font-family:var(--body); font-size:13px;">' +
        '<button data-action="calc-save-meal" class="hover-lime-fill" style="cursor:pointer; background:var(--lime); border:none; border-radius:8px; padding:8px 14px; color:#101214; font-family:var(--mono); font-size:11px; font-weight:700; text-transform:uppercase;">Save</button>' +
      '</div>'
    : "";

  el.innerHTML =
    '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">' +
      '<div style="font-family:var(--mono); font-size:11px; letter-spacing:0.14em; text-transform:uppercase; color:var(--lime);">Saved Meals</div>' +
      '<button data-action="calc-toggle-save-box" class="hover-lime-text" style="cursor:pointer; background:none; border:1px solid var(--border); border-radius:7px; padding:6px 12px; color:var(--text2); font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase;">' + (state.calcShowSaveBox ? "Cancel" : "+ Save Foods As Combo") + '</button>' +
    '</div>' +
    listHtml + saveBoxHtml;
}

function renderCalculatorShell() {
  var slotOptions = CALC_SLOTS.map(function (s) {
    return '<option value="' + s + '"' + (s === state.calcSlotAssign ? " selected" : "") + '>' + s + '</option>';
  }).join("");

  $("calculatorContainer").innerHTML =
    '<section style="max-width:1280px; margin:8px auto 0; padding:0 32px;">' +
      '<div style="background:var(--card); border:1px solid var(--border); border-radius:16px; overflow:hidden;">' +
        '<div style="padding:24px 26px 20px; border-bottom:1px solid var(--border);">' +
          '<div style="font-family:var(--mono); font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--orange); margin-bottom:8px; font-weight:600;">Build Your Own · Not A Recipe</div>' +
          '<h2 style="font-family:var(--cond); font-size:34px; font-weight:700; text-transform:uppercase; color:var(--text); margin:0; line-height:0.95;">Custom Meal Calculator</h2>' +
          '<p style="font-size:14px; line-height:1.6; color:var(--text2); margin:12px 0 0; max-width:760px;">Search for a food, weigh it out, and log it — everything you add sums into the scoreboard at the bottom of the screen. Search for a raw ingredient, or build up a combo (like a burrito: tortilla + beans + meat) and save it as one reusable item.</p>' +
        '</div>' +

        '<div style="padding:22px 26px; border-bottom:1px solid var(--border); background:var(--panel2);" id="calcSavedMealsWrapper"></div>' +

        '<div style="padding:22px 26px;">' +
          '<div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px;">' +
            '<input type="text" id="calcSearchInput" placeholder="Search the food database…" style="flex:1; min-width:200px; background:var(--card2); border:1px solid var(--border); border-radius:10px; padding:10px 14px; color:var(--text); font-family:var(--body); font-size:14px;">' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
              '<span style="font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3);">Weigh in</span>' +
              '<div style="display:flex; border:1px solid var(--border); border-radius:8px; overflow:hidden;">' +
                '<button data-action="calc-set-weight-unit" data-unit="oz" style="cursor:pointer; border:none; padding:7px 11px; font-family:var(--mono); font-size:11px; font-weight:600; text-transform:uppercase; background:' + (state.calcWeightUnit === "oz" ? "var(--lime)" : "var(--card2)") + '; color:' + (state.calcWeightUnit === "oz" ? "#101214" : "var(--text2)") + ';">oz</button>' +
                '<button data-action="calc-set-weight-unit" data-unit="g" style="cursor:pointer; border:none; border-left:1px solid var(--border); padding:7px 11px; font-family:var(--mono); font-size:11px; font-weight:600; text-transform:uppercase; background:' + (state.calcWeightUnit === "g" ? "var(--lime)" : "var(--card2)") + '; color:' + (state.calcWeightUnit === "g" ? "#101214" : "var(--text2)") + ';">g</button>' +
              '</div>' +
            '</div>' +
            '<div style="display:flex; align-items:center; gap:8px;">' +
              '<span style="font-family:var(--mono); font-size:10px; letter-spacing:0.06em; text-transform:uppercase; color:var(--text3);">Add to</span>' +
              '<select id="calcSlotSelect" data-action="calc-set-add-slot" style="background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:7px 10px; color:var(--text); font-family:var(--mono); font-size:11px;">' + slotOptions + '</select>' +
            '</div>' +
          '</div>' +
          '<div id="calcFoodListWrapper"></div>' +
        '</div>' +
      '</div>' +
    '</section>';

  renderCalcSavedMeals();
  renderCalcFoodList();
}

function renderTray() {
  if (!state.trayOpen) { $("trayContainer").innerHTML = ""; return; }

  var itemsHtml;
  if (state.dayLog.length === 0) {
    itemsHtml = '<div style="padding:32px 0; text-align:center; color:var(--text4); font-family:var(--body); font-size:15px;">Nothing logged yet — use the Custom Meal Calculator above to add a food.</div>';
  } else {
    var slotGroups = { "Unassigned": [] };
    CALC_SLOTS.forEach(function (s) { slotGroups[s] = []; });
    state.dayLog.forEach(function (it) { slotGroups[it.slot || "Unassigned"].push(it); });

    var order = ["Unassigned"].concat(CALC_SLOTS);
    itemsHtml = order.filter(function (s) { return slotGroups[s].length > 0; }).map(function (slot) {
      var rows = slotGroups[slot].map(function (it) {
        var m = dayLogItemMacros(it);
        var label = dayLogItemLabel(it);
        var food = calcFoodById(it.refId);
        var qtyLabel = food.unit === "g" ? (it.qty + "g") : (it.qty + " " + (food.unitLabel || "×"));
        var midCount = "";
        var slotOptions = order.map(function (s) {
          var val = s === "Unassigned" ? "" : s;
          var sel = (it.slot || "Unassigned") === s ? " selected" : "";
          return '<option value="' + val + '"' + sel + '>' + s + '</option>';
        }).join("");
        return '<div style="display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid #e2e0d5; flex-wrap:wrap;">' +
          '<div style="flex:1; min-width:150px;">' +
            '<div style="font-family:var(--cond); font-size:17px; font-weight:600; text-transform:uppercase; color:var(--text); line-height:1.15;">' + esc(label) + '</div>' +
            '<div style="font-family:var(--mono); font-size:10.5px; color:var(--text3); margin-top:3px;">' + qtyLabel + ' · ' + Math.round(m.protein) + 'g P · ' + Math.round(m.calories) + ' cal</div>' +
          '</div>' +
          '<select data-action="daylog-set-slot" data-uid="' + it.uid + '" style="background:var(--card2); border:1px solid var(--border); border-radius:6px; padding:5px 7px; color:var(--text2); font-family:var(--mono); font-size:10px;">' + slotOptions + '</select>' +
          '<div style="display:flex; align-items:center; gap:6px;">' +
            '<button class="qty-btn hover-step" style="width:28px; height:28px; font-size:16px;" data-action="daylog-step" data-uid="' + it.uid + '" data-dir="-1">–</button>' +
            midCount +
            '<button class="qty-btn hover-step" style="width:28px; height:28px; font-size:16px;" data-action="daylog-step" data-uid="' + it.uid + '" data-dir="1">+</button>' +
            '<button data-action="daylog-remove" data-uid="' + it.uid + '" class="hover-red" style="cursor:pointer; background:none; border:1px solid var(--border); border-radius:6px; width:28px; height:28px; color:var(--text3); font-size:13px;">✕</button>' +
          '</div>' +
        '</div>';
      }).join("");
      return '<div style="margin-bottom:14px;">' +
        '<div style="font-family:var(--mono); font-size:10px; letter-spacing:0.12em; text-transform:uppercase; color:var(--lime); margin-bottom:2px;">' + slot + '</div>' +
        rows +
      '</div>';
    }).join("");
  }

  // Position the tray exactly above the fixed footer's actual rendered height
  // (which varies between the compact mobile layout, the fuller desktop one,
  // and the iPhone home-indicator safe-area inset) rather than a guessed number.
  var sbEl = $("scoreboardContainer");
  var footerH = sbEl ? sbEl.getBoundingClientRect().height : 104;

  $("trayContainer").innerHTML =
    '<div style="position:fixed; left:0; right:0; bottom:' + footerH + 'px; z-index:40; display:flex; justify-content:center; padding:0 16px;">' +
      '<div style="width:100%; max-width:760px; background:var(--card); border:1px solid var(--border); border-radius:16px 16px 0 0; box-shadow:0 -20px 60px rgba(0,0,0,0.12); animation:trayUp 0.22s ease; max-height:52vh; display:flex; flex-direction:column;">' +
        '<div style="display:flex; justify-content:space-between; align-items:center; padding:18px 22px; border-bottom:1px solid var(--border);">' +
          '<div style="font-family:var(--cond); font-size:24px; font-weight:600; text-transform:uppercase; color:var(--text);">Today’s Log</div>' +
          '<button data-action="clear-day" class="hover-red" style="cursor:pointer; background:none; border:1px solid var(--border); border-radius:8px; padding:6px 12px; color:var(--text3); font-family:var(--mono); font-size:10px; letter-spacing:0.1em; text-transform:uppercase;">Clear all</button>' +
        '</div>' +
        '<div style="overflow-y:auto; padding:8px 22px 18px;">' + itemsHtml + '</div>' +
      '</div>' +
    '</div>';
}

function renderScoreboard() {
  var st = dayTotals();
  var target = DAILY_TARGET;
  var zone = proteinZone(st.protein);
  var maxScale = target.protein + 60;
  var fillPct = Math.min((st.protein / maxScale) * 100, 100).toFixed(1) + "%";
  var floorPct = ((CALC_PROTEIN_FLOOR / maxScale) * 100).toFixed(1) + "%";

  // Fat, carbs and calories are colored against the daily target the same
  // way the calculator's bars are, so the scoreboard flags "you're already
  // close to your fat budget" instead of just a raw number — and the
  // saturated portion is broken out separately underneath, since a gram of
  // olive oil isn't the same as a gram of butter.
  var calZone = calcMacroZone(st.calories, target.calories, 50);
  var carbZone = calcMacroZone(st.carbs, target.carbs, 10);
  var fatZone = calcMacroZone(st.fat, target.fat, 10);
  var satShare = st.fat > 0 ? st.satFat / st.fat : 0;
  var satColor = satShare > 0.55 ? "var(--red)" : "var(--text3)";

  var trayLabel = state.trayOpen ? "Hide day" : "View day";

  var desktopHtml =
    '<div class="sb-desktop" style="max-width:1280px; margin:0 auto; padding:14px 24px; display:flex; align-items:center; gap:24px; flex-wrap:wrap;">' +
      '<div style="flex:0 0 auto;">' +
        '<div style="font-family:var(--mono); font-size:10px; letter-spacing:0.14em; text-transform:uppercase; color:var(--text3);">' + target.label + ' · ' + esc(zone.label) + '</div>' +
        '<div style="display:flex; align-items:baseline; gap:8px;">' +
          '<span style="font-family:var(--cond); font-size:44px; font-weight:700; color:' + zone.color + '; line-height:0.9;">' + st.protein + '</span>' +
          '<span style="font-family:var(--cond); font-size:20px; color:var(--text4);">/ ' + target.protein + 'g</span>' +
        '</div>' +
      '</div>' +
      '<div style="flex:1; min-width:220px;">' +
        '<div style="position:relative; height:12px; background:var(--card2); border-radius:20px; overflow:hidden;">' +
          '<div style="position:absolute; top:-3px; bottom:-3px; width:2px; left:' + floorPct + '; background:var(--red); opacity:0.55;"></div>' +
          '<div style="height:100%; width:' + fillPct + '; background:' + zone.color + '; border-radius:20px; transition:width 0.3s ease;"></div>' +
        '</div>' +
        '<div style="display:flex; justify-content:space-between; margin-top:6px;">' +
          '<div style="font-family:var(--mono); font-size:11px; color:var(--text3);">' + esc(zone.hint) + '</div>' +
        '</div>' +
      '</div>' +
      '<div style="display:flex; gap:18px; flex:0 0 auto;">' +
        '<div style="text-align:center;">' +
          '<div style="font-family:var(--cond); font-size:24px; font-weight:600; color:' + calZone.color + '; line-height:1;">' + st.calories + '</div>' +
          '<div style="font-family:var(--mono); font-size:9px; letter-spacing:0.06em; color:var(--text4); text-transform:uppercase;">/ ' + target.calories + ' cal</div>' +
        '</div>' +
        '<div style="text-align:center;">' +
          '<div style="font-family:var(--cond); font-size:24px; font-weight:600; color:' + carbZone.color + '; line-height:1;">' + st.carbs + '</div>' +
          '<div style="font-family:var(--mono); font-size:9px; letter-spacing:0.06em; color:var(--text4); text-transform:uppercase;">/ ' + target.carbs + 'g carbs</div>' +
        '</div>' +
        '<div style="text-align:center;">' +
          '<div style="font-family:var(--cond); font-size:24px; font-weight:600; color:' + fatZone.color + '; line-height:1;">' + st.fat + '</div>' +
          '<div style="font-family:var(--mono); font-size:9px; letter-spacing:0.06em; color:var(--text4); text-transform:uppercase;">/ ' + target.fat + 'g fat</div>' +
          '<div style="font-family:var(--mono); font-size:8.5px; color:' + satColor + '; margin-top:1px;">' + st.satFat + 'g sat</div>' +
        '</div>' +
      '</div>' +
      '<button data-action="toggle-tray" style="cursor:pointer; flex:0 0 auto; background:var(--lime); border:none; border-radius:10px; padding:12px 20px; font-family:var(--cond); font-size:18px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:#101214;">' + trayLabel + ' <span style="font-family:var(--mono); font-size:13px;">(' + state.dayLog.length + ')</span></button>' +
    '</div>';

  // Compact single-column layout for phones — same data, far less vertical space:
  // one row (protein + zone + button), a thin progress bar, one small detail line.
  var mobileHtml =
    '<div class="sb-mobile" style="max-width:1280px; margin:0 auto; padding:9px 16px 10px;">' +
      '<div style="display:flex; align-items:center; justify-content:space-between; gap:10px;">' +
        '<div style="display:flex; align-items:baseline; gap:7px; min-width:0;">' +
          '<span style="font-family:var(--cond); font-size:26px; font-weight:700; color:' + zone.color + '; line-height:1;">' + st.protein + 'g</span>' +
          '<span style="font-family:var(--mono); font-size:9.5px; letter-spacing:0.04em; text-transform:uppercase; color:var(--text3); white-space:nowrap;">' + target.label + ' · ' + esc(zone.label) + '</span>' +
        '</div>' +
        '<button data-action="toggle-tray" style="cursor:pointer; flex:0 0 auto; background:var(--lime); border:none; border-radius:8px; padding:8px 13px; font-family:var(--cond); font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:0.02em; color:#101214;">' + trayLabel + ' <span style="font-family:var(--mono); font-size:10px;">(' + state.dayLog.length + ')</span></button>' +
      '</div>' +
      '<div style="position:relative; height:5px; background:var(--card2); border-radius:20px; overflow:hidden; margin-top:7px;">' +
        '<div style="position:absolute; top:-2px; bottom:-2px; width:2px; left:' + floorPct + '; background:var(--red); opacity:0.55;"></div>' +
        '<div style="height:100%; width:' + fillPct + '; background:' + zone.color + '; border-radius:20px; transition:width 0.3s ease;"></div>' +
      '</div>' +
      '<div style="display:flex; justify-content:space-between; gap:10px; margin-top:5px; font-family:var(--mono); font-size:10px; color:var(--text3); white-space:nowrap;">' +
        '<span style="overflow:hidden; text-overflow:ellipsis;">' +
          '<span style="color:' + calZone.color + ';">' + st.calories + 'cal</span> · ' +
          '<span style="color:' + carbZone.color + ';">' + st.carbs + 'gC</span> · ' +
          '<span style="color:' + fatZone.color + ';">' + st.fat + 'gF</span>' +
          '<span style="color:' + satColor + ';"> (' + st.satFat + ' sat)</span>' +
        '</span>' +
      '</div>' +
    '</div>';

  $("scoreboardContainer").innerHTML = desktopHtml + mobileHtml;
  renderMacrosPanel();
}

// ---------------------------------------------------------------------
// Actions
// ---------------------------------------------------------------------

function toggleDrive() {
  state.showDrive = !state.showDrive;
  renderHeader();
  renderPanels();
  if (state.showDrive) { var el = $("panelsContainer"); if (el) el.scrollIntoView({ behavior: "smooth", block: "start" }); }
}

function clearDay() { state.dayLog = []; saveDayLog(); state.trayOpen = false; renderScoreboard(); renderTray(); }
function toggleTray() { state.trayOpen = !state.trayOpen; renderScoreboard(); renderTray(); }

// ---------------------------------------------------------------------
// Event delegation
// ---------------------------------------------------------------------

document.addEventListener("click", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  var id = el.getAttribute("data-id");
  switch (action) {
    case "toggle-drive": toggleDrive(); break;
    case "clear-day": clearDay(); break;
    case "daylog-step": dayLogStep(el.getAttribute("data-uid"), parseInt(el.getAttribute("data-dir"), 10)); break;
    case "daylog-remove": dayLogRemove(el.getAttribute("data-uid")); break;
    case "toggle-tray": toggleTray(); break;
    case "ack-disclaimer": ackDisclaimer(); break;
    case "toggle-macros": toggleMacros(); break;
    case "calc-add-food": calcAddFood(el.getAttribute("data-food-id")); break;
    case "calc-set-weight-unit": calcSetWeightUnit(el.getAttribute("data-unit")); break;
    case "calc-toggle-save-box": calcToggleSaveBox(); break;
    case "calc-save-meal": calcSaveMeal(); break;
    case "calc-load-saved": calcLoadSavedMeal(el.getAttribute("data-uid")); break;
    case "calc-delete-saved": calcDeleteSavedMeal(el.getAttribute("data-uid")); break;
  }
});

document.addEventListener("input", function (e) {
  if (e.target.id === "calcSearchInput") calcOnSearch(e.target.value);
  if (e.target.id === "calcSaveNameInput") calcSaveNameInput(e.target.value);
});

document.addEventListener("change", function (e) {
  var el = e.target.closest("[data-action]");
  if (!el) return;
  var action = el.getAttribute("data-action");
  if (action === "daylog-set-slot") dayLogSetSlot(el.getAttribute("data-uid"), el.value || null);
  if (action === "calc-set-add-slot") calcSetAddSlot(el.value);
});

// ---------------------------------------------------------------------
// Shell / initial mount
// ---------------------------------------------------------------------

function mountShell() {
  var app = $("app");
  app.innerHTML =
    '<div id="disclaimerContainer"></div>' +
    '<header style="max-width:1280px; margin:0 auto; padding:48px 32px 12px;">' +
      '<div style="font-family:var(--mono); font-size:12px; letter-spacing:0.22em; text-transform:uppercase; color:var(--lime); margin-bottom:16px; font-weight:600;">Recomp Fuel · 185g+ protein / day</div>' +
      '<h1 style="font-family:var(--cond); font-size:76px; line-height:0.9; font-weight:700; text-transform:uppercase; letter-spacing:0.005em; margin:0; color:var(--text);">Meal Plan</h1>' +
      '<p style="font-size:17px; line-height:1.6; color:var(--text2); max-width:640px; margin:20px 0 0;">A food-by-food calorie and macro tracker for body recomposition. Search the database below, weigh it out, and log it — everything you eat sums into the scoreboard at the bottom of the screen.</p>' +
      '<div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap; margin-top:22px;">' +
        '<span id="totalMealsBadge" style="font-family:var(--mono); font-size:11px; letter-spacing:0.12em; text-transform:uppercase; color:#101214; background:var(--lime); padding:6px 12px; border-radius:6px; font-weight:600; box-shadow:0 2px 8px rgba(82,115,74,0.18);"></span>' +
      '</div>' +
      '<div id="headerButtons" style="margin-top:18px; display:flex; gap:10px; flex-wrap:wrap;"></div>' +
    '</header>' +

    '<div id="panelsContainer"></div>' +
    '<div id="macrosContainer"></div>' +
    '<div id="calculatorContainer"></div>' +

    '<div id="trayContainer"></div>' +

    '<div id="scoreboardContainer" style="position:fixed; left:0; right:0; bottom:0; z-index:50; background:#ffffff; border-top:1px solid var(--border); padding-bottom:env(safe-area-inset-bottom, 0px);"></div>';
}

function renderAll() {
  renderDisclaimer();
  renderHeader();
  renderPanels();
  renderCalculatorShell();
  renderScoreboard();
  renderTray();
}

loadPersisted();
mountShell();
renderAll();

})();

</script>
